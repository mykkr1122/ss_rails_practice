ja:
  support:
    array:
      sentence_connector: "、"
      two_words_connector: "と"
      last_word_connector: "、"
  errors:
    format: "%{attribute} %{message}"
  flash:
    products:
      not_found: 商品が見つかりませんでした
    admin:
      products:
        create:
          notice: 商品を登録しました
          alert: 商品を登録できませんでした
        update:
          notice: 商品を更新しました
          alert: 商品を更新できませんでした
        destroy:
          notice: 商品を削除しました
          alert: 商品を削除できませんでした
        not_found: 商品が見つかりませんでした
    cart_items:
      create:
        notice: カートに追加しました
        alert: カートに追加できませんでした
      update:
        notice: カートを更新しました
        alert: カートを更新できませんでした
      destroy:
        notice: カートから削除しました
        alert: カートから削除できませんでした
      not_found: カートの商品が見つかりませんでした
  activerecord:
    attributes:
      cart_item:
        quantity: 数量
        sku_id: SKU
        product: 商品
        price: 価格
        total_price: 合計金額
        created_at: 作成日時
        updated_at: 更新日時
      product:
        name: 商品名
        status: ステータス
        description: 説明
        store: 店舗
        skus: SKU
        created_at: 作成日時
        updated_at: 更新日時
      # 入れ子フォームのエラー（skus.stock など）用
      "product/skus":
        code: SKUコード
        price: 価格
        stock: 在庫数
        _destroy: 削除
      store:
        name: 店舗名
        store_number: 店舗番号
        created_at: 作成日時
        updated_at: 更新日時
      sku:
        code: SKUコード
        price: 価格
        stock: 在庫数
        _destroy: 削除
        created_at: 作成日時
        updated_at: 更新日時
    errors:
      messages:
        blank: を入力してください
        taken: は既に存在します
        not_a_number: は数値で入力してください
        not_an_integer: は整数で入力してください
        greater_than_or_equal_to: は%{count}以上にしてください
      models:
        product:
          attributes:
            skus:
              blank: は1件以上必要です
            base:
              in_cart: カートに入っているため削除できません
              sku_in_cart: カートに入っているSKUは削除できません
        cart_item:
          not_available: この商品はカートに追加できません
          sold_out: この商品は売り切れです
          attributes:
            quantity:
              less_than_or_equal_to: は在庫数(%{count})以下にしてください
              greater_than: は1以上にしてください
