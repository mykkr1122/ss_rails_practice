ja:
  support:
    array:
      sentence_connector: "、"
      two_words_connector: "と"
      last_word_connector: "、"
  errors:
    format: "%{attribute} %{message}"
  flash:
    products:
      not_found: 商品が見つかりませんでした
    admin:
      products:
        create:
          notice: 商品を登録しました
          alert: 商品を登録できませんでした
        update:
          notice: 商品を更新しました
          alert: 商品を更新できませんでした
        destroy:
          notice: 商品を削除しました
          alert: 商品を削除できませんでした
        not_found: 商品が見つかりませんでした
      orders:
        not_found: 注文が見つかりませんでした
        complete:
          notice: 注文を完了しました
          alert: この注文は既に完了しています
    cart_items:
      create:
        notice: カートに追加しました
        alert: カートに追加できませんでした
      update:
        notice: カートを更新しました
        alert: カートを更新できませんでした
      destroy:
        notice: カートから削除しました
        alert: カートから削除できませんでした
      not_found: カートの商品が見つかりませんでした
    orders:
      create:
        notice: 注文を受け付けました。 決済画面へ移動します。
        alert: 注文を確定できませんでした
      pay:
        already: この注文は既に支払いが完了しています
        notice: 決済が完了しました
        alert: 決済を完了できませんでした
      not_found: 注文が見つかりませんでした
      empty_cart: カートが空です
      unpaid_exists: 未支払いの注文があります。先に決済を完了してください
  enums:
    order:
      status:
        new: 新規
        complete: 完了
  activerecord:
    attributes:
      cart_item:
        quantity: 数量
        sku_id: SKU
        product: 商品
        price: 価格
        total_price: 合計金額
        created_at: 作成日時
        updated_at: 更新日時
      product:
        name: 商品名
        status: ステータス
        description: 説明
        store: 店舗
        skus: SKU
        created_at: 作成日時
        updated_at: 更新日時
      # 入れ子フォームのエラー（skus.stock など）用
      "product/skus":
        code: SKUコード
        price: 価格
        stock: 在庫数
        _destroy: 削除
      store:
        name: 店舗名
        store_number: 店舗番号
        created_at: 作成日時
        updated_at: 更新日時
      sku:
        code: SKUコード
        price: 価格
        stock: 在庫数
        _destroy: 削除
        created_at: 作成日時
        updated_at: 更新日時
      user:
        name: お名前
        email: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認）
        current_password: 現在のパスワード
        remember_me: ログインしたままにする
      order:
        customer_name: お名前
        customer_email: メールアドレス
        status: ステータス
        created_at: 作成日時
        updated_at: 更新日時
      order_item:
        quantity: 数量
        price: 価格
        total_price: 合計金額
        created_at: 作成日時
        updated_at: 更新日時
    errors:
      messages:
        blank: を入力してください
        taken: は既に存在します
        not_a_number: は数値で入力してください
        not_an_integer: は整数で入力してください
        greater_than_or_equal_to: は%{count}以上にしてください
        too_short: は%{count}文字以上で入力してください
        confirmation: と%{attribute}の入力が一致しません
        invalid: の形式が正しくありません
      models:
        product:
          attributes:
            skus:
              blank: は1件以上必要です
            base:
              in_cart: カートに入っているため削除できません
              sku_in_cart: カートに入っているSKUは削除できません
              in_order: 注文中のため削除できません
              sku_in_order: 注文中のSKUは削除できません
        cart_item:
          not_available: この商品はカートに追加できません
          sold_out: この商品は売り切れです
          attributes:
            quantity:
              less_than_or_equal_to: は在庫数(%{count})以下にしてください
              greater_than: は1以上にしてください
        order:
          cart_empty: カートが空です
          not_available: この商品は現在購入できません
          sold_out: この商品は売り切れです
